<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="2026 空間資訊脈絡 動態採樣技術 工作營" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0710"/>
      <stop offset="0.6" stop-color="#050505"/>
      <stop offset="1" stop-color="#1a0a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff5f00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5f00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#ff5f00" fill-opacity="0.35"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- point cloud field (sampled room) -->
  <g opacity="0.9">
    <rect x="860" y="140" width="640" height="560" fill="url(#dots)" opacity="0.5"/>
    <g fill="#ff8a3d">
      <circle cx="930" cy="520" r="2.5"/><circle cx="960" cy="470" r="2"/><circle cx="1000" cy="430" r="2.5"/>
      <circle cx="1040" cy="395" r="2"/><circle cx="1090" cy="380" r="3"/><circle cx="1140" cy="372" r="2"/>
      <circle cx="1190" cy="380" r="2.5"/><circle cx="1240" cy="402" r="2"/><circle cx="1290" cy="440" r="3"/>
      <circle cx="1330" cy="486" r="2"/><circle cx="1360" cy="540" r="2.5"/><circle cx="1380" cy="600" r="2"/>
      <circle cx="980" cy="560" r="2"/><circle cx="1030" cy="600" r="2.5"/><circle cx="1090" cy="630" r="2"/>
      <circle cx="1160" cy="645" r="3"/><circle cx="1230" cy="640" r="2"/><circle cx="1300" cy="618" r="2.5"/>
      <circle cx="1120" cy="500" r="2"/><circle cx="1180" cy="520" r="2.5"/><circle cx="1070" cy="540" r="2"/>
      <circle cx="1250" cy="540" r="2"/><circle cx="1210" cy="470" r="2"/><circle cx="1150" cy="440" r="2.5"/>
    </g>
    <!-- room wireframe -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5">
      <path d="M900 250 L1180 170 L1460 250 L1460 640 L1180 720 L900 640 Z"/>
      <path d="M900 250 L1180 330 L1460 250"/>
      <path d="M1180 330 L1180 720"/>
    </g>
  </g>

  <!-- sensing pulses -->
  <g fill="none" stroke="#ff5f00" stroke-width="2" opacity="0.9">
    <circle cx="1180" cy="520" r="22" opacity="0.9"/>
    <circle cx="1180" cy="520" r="52" opacity="0.5"/>
    <circle cx="1180" cy="520" r="90" opacity="0.25"/>
  </g>
  <circle cx="1180" cy="520" r="7" fill="#ffe6cc"/>

  <!-- signal trace (ADC sampling) -->
  <path d="M120 690 L180 690 L200 640 L220 690 L300 690 L320 600 L340 690 L420 690 L440 660 L460 690 L560 690 L580 560 L600 690 L700 690 L720 650 L740 690 L820 690"
        fill="none" stroke="#ff5f00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ff5f00">
    <circle cx="200" cy="640" r="5"/><circle cx="320" cy="600" r="5"/><circle cx="440" cy="660" r="5"/>
    <circle cx="580" cy="560" r="5"/><circle cx="720" cy="650" r="5"/>
  </g>
  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="16" fill="#ffffff" fill-opacity="0.55">
    <text x="196" y="624">LDR</text>
    <text x="300" y="584">IR</text>
    <text x="414" y="644">BTN</text>
    <text x="548" y="544">WiFi</text>
    <text x="692" y="634">PWM</text>
  </g>

  <!-- title block -->
  <g font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
    <text x="120" y="190" font-size="22" letter-spacing="8" fill="#ff5f00" font-weight="700">IIMA HUB / EVENT</text>
    <text x="120" y="300" font-size="86" font-weight="900" fill="#ffffff">2026</text>
    <text x="120" y="400" font-size="64" font-weight="900" fill="#ffffff">空間資訊脈絡</text>
    <text x="120" y="480" font-size="64" font-weight="900" fill="#ffffff">動態採樣技術 工作營</text>
  </g>
  <g font-family="Consolas, 'Cascadia Code', monospace" fill="#ffffff" fill-opacity="0.7" font-size="20" letter-spacing="3">
